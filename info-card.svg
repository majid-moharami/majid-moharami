<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490" width="100%" height="100%">
  <defs>
    <style>
      @keyframes rowSlideIn {
        0% { opacity: 0; transform: translateX(-8px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      .bg { fill: #0a0e14; stroke: #30363d; stroke-width: 1; rx: 10px; }
      .titlebar { fill: #0d1117; }
      .title-text { fill: #e6edf3; font-size: 11px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .fade-row { animation: rowSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .user-header { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #39d353; }
      .divider-line { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #7d8590; }
      .row-key { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #79c0ff; }
      .row-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="490" height="490" class="bg" />

  <!-- Terminal Header -->
