<svg xmlns="http://www.w3.org/2000/svg" width="420" height="470" viewBox="0 0 420 470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <style>
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .bg { fill: url(#devBg); stroke: #30363d; stroke-width: 1; rx: 10px; }
      .titlebar { fill: #0d1117; }
      .title-text { fill: #8b949e; font-size: 11px; font-weight: 500; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .tag-role { fill: #bc8cff; font-size: 9px; font-weight: 700; font-family: ui-monospace, monospace; }
      .sec-title { fill: #8b949e; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; font-family: ui-monospace, SFMono-Regular, monospace; }
      .dev-name { fill: #f0f6fc; font-size: 17px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, monospace; }
      .dev-title { fill: #3fb950; font-size: 12px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, monospace; }
      .dev-company { fill: #d29922; font-size: 11px; font-weight: 500; }
      .bio-text { fill: #c9d1d9; font-size: 11px; font-weight: 400; }
      .badge-chip { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 5px; }
      .badge-txt { fill: #e6edf3; font-size: 10px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, monospace; }
      .focus-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6px; }
      .focus-title { fill: #38bdf8; font-size: 11px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, monospace; }
      .focus-desc { fill: #c9d1d9; font-size: 10px; font-weight: 400; }
      .status-pill-opp { fill: #238636; fill-opacity: 0.15; stroke: #3fb950; stroke-width: 1; rx: 12px; }
      .status-opp-txt { fill: #3fb950; font-size: 10px; font-weight: 700; font-family: ui-monospace, monospace; }
      .opp-dot { fill: #3fb950; animation: pulseDot 2s infinite; }
      .anim-row { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="420" height="470" class="bg" />

  <!-- Titlebar -->
  <path d="M 0 10 Q 0 0 10 0 L 410 0 Q 420 0 420 10 L 420 36 L 0 36 Z" class="titlebar" />
  <line x1="0" y1="36" x2="420" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="18" cy="18" r="5" fill="#ff5f56" />
  <circle cx="32" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="46" cy="18" r="5" fill="#27c93f" />

  <!-- Title & Status -->
  <text x="210" y="22" text-anchor="middle" class="title-text">👤 majid.profile // executive</text>
  <text x="402" y="22" text-anchor="end" class="tag-role">[ ANDROID ]</text>

  <!-- SECTION 1: HEADER & IDENTITY -->
  <g class="anim-row" style="animation-delay: 0.05s">
    <text x="20" y="62" class="dev-name">Majid Moharami</text>
    <text x="20" y="82" class="dev-title">Senior Android Developer • Mobile Architect</text>
    <text x="20" y="100" class="dev-company">🏢 Myket — Leading Android App Store (20M+ MAU)</text>
    <text x="20" y="118" class="bio-text">Specialized in building high-concurrency, reactive Android</text>
    <text x="20" y="134" class="bio-text">architectures with 99.8%+ crash-free reliability at scale.</text>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="148" x2="400" y2="148" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3" />

  <!-- SECTION 2: TECH ARSENAL CHIPS -->
  <g class="anim-row" style="animation-delay: 0.15s">
    <text x="20" y="168" class="sec-title">TECH ARSENAL &amp; ECOSYSTEM</text>

    <!-- Row 1 Badges -->
    <rect x="20" y="178" width="68" height="24" class="badge-chip" />
    <text x="54" y="194" text-anchor="middle" class="badge-txt" fill="#bc8cff">Kotlin</text>

    <rect x="94" y="178" width="124" height="24" class="badge-chip" />
    <text x="156" y="194" text-anchor="middle" class="badge-txt" fill="#38bdf8">Jetpack Compose</text>

    <rect x="224" y="178" width="90" height="24" class="badge-chip" />
    <text x="269" y="194" text-anchor="middle" class="badge-txt" fill="#bc8cff">Coroutines</text>

    <rect x="320" y="178" width="80" height="24" class="badge-chip" />
    <text x="360" y="194" text-anchor="middle" class="badge-txt" fill="#3fb950">Flow / MVI</text>

    <!-- Row 2 Badges -->
    <rect x="20" y="208" width="92" height="24" class="badge-chip" />
    <text x="66" y="224" text-anchor="middle" class="badge-txt" fill="#38bdf8">Clean Arch</text>

    <rect x="118" y="208" width="90" height="24" class="badge-chip" />
    <text x="163" y="224" text-anchor="middle" class="badge-txt" fill="#bc8cff">Hilt / Koin</text>

    <rect x="214" y="208" width="86" height="24" class="badge-chip" />
    <text x="257" y="224" text-anchor="middle" class="badge-txt" fill="#d29922">Room DB</text>

    <rect x="306" y="208" width="94" height="24" class="badge-chip" />
    <text x="353" y="224" text-anchor="middle" class="badge-txt" fill="#38bdf8">Retrofit / REST</text>

    <!-- Row 3 Badges -->
    <rect x="20" y="238" width="104" height="24" class="badge-chip" />
    <text x="72" y="254" text-anchor="middle" class="badge-txt" fill="#d29922">Multi-Module</text>

    <rect x="130" y="238" width="116" height="24" class="badge-chip" />
    <text x="188" y="254" text-anchor="middle" class="badge-txt" fill="#3fb950">CI/CD Pipelines</text>

    <rect x="252" y="238" width="148" height="24" class="badge-chip" />
    <text x="326" y="254" text-anchor="middle" class="badge-txt" fill="#bc8cff">JUnit • Mockk • Tests</text>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="274" x2="400" y2="274" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3" />

  <!-- SECTION 3: ENGINEERING DOMAINS -->
  <g class="anim-row" style="animation-delay: 0.25s">
    <text x="20" y="294" class="sec-title">CORE ENGINEERING FOCUS</text>

    <!-- Domain Card 1 -->
    <rect x="20" y="304" width="380" height="38" class="focus-box" />
    <text x="32" y="321" class="focus-title">⚡ High-Concurrency &amp; Offline-First Apps</text>
    <text x="32" y="335" class="focus-desc">Room DB sync, background workers, and reactive StateFlow</text>

    <!-- Domain Card 2 -->
    <rect x="20" y="350" width="380" height="38" class="focus-box" />
    <text x="32" y="367" class="focus-title">🎨 Fluid 60+ FPS Jetpack Compose UI</text>
    <text x="32" y="381" class="focus-desc">Design systems, custom layouts, and animation performance</text>

    <!-- Palette dots at bottom -->
    <g>
      <circle cx="30" cy="446" r="5.5" fill="#ef4444" />
      <circle cx="52" cy="446" r="5.5" fill="#f97316" />
      <circle cx="74" cy="446" r="5.5" fill="#eab308" />
      <circle cx="96" cy="446" r="5.5" fill="#22c55e" />
      <circle cx="118" cy="446" r="5.5" fill="#06b6d4" />
      <circle cx="140" cy="446" r="5.5" fill="#3b82f6" />
      <circle cx="162" cy="446" r="5.5" fill="#a855f7" />
      <circle cx="184" cy="446" r="5.5" fill="#ec4899" />
    </g>

    <!-- Opportunities Pill -->
    <rect x="224" y="432" width="176" height="26" class="status-pill-opp" />
    <circle cx="238" cy="445" r="4" class="opp-dot" />
    <text x="250" y="449" class="status-opp-txt">Open to Opportunities</text>
  </g>
</svg>