    <g class="fade-row" style="animation-delay:0.905s">
      <rect x="24" y="410" width="16" height="14" rx="3" fill="#ff5555" /><rect x="48" y="410" width="16" height="14" rx="3" fill="#50fa7b" /><rect x="72" y="410" width="16" height="14" rx="3" fill="#f1fa8c" /><rect x="96" y="410" width="16" height="14" rx="3" fill="#bd93f9" /><rect x="120" y="410" width="16" height="14" rx="3" fill="#ff79c6" /><rect x="144" y="410" width="16" height="14" rx="3" fill="#8be9fd" /><rect x="168" y="410" width="16" height="14" rx="3" fill="#f8f8f2" /><rect x="192" y="410" width="16" height="14" rx="3" fill="#6272a4" />
