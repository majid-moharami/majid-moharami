  <line x1="0" y1="34" x2="490" y2="34" stroke="#30363d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="17" r="5" fill="#ff5f56" />
  <circle cx="38" cy="17" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="17" r="5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="255" y="21" text-anchor="middle" class="title-text">💻 neofetch --system</text>

