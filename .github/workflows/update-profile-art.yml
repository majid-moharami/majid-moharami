name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch real contributions
        run: node scripts/fetch_contributions.js
        env:
          GH_PROFILE_USER: majid-moharami

      - name: Render contribution heatmap SVG
        run: node scripts/render_heatmap_svg.js

      - name: Commit & push updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
